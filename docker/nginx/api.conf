server {
    server_name  localhost;

    location / {
         root   /usr/share/nginx/html;
         index  index.html index.htm;
    }

    location = /api/ws {
        proxy_pass          http://api:8000/ws;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }

    location /api {
        rewrite             ^/api/(.*)$ /$1 break;
        proxy_pass          http://api:8000/;
    }
}
